name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: gofmt -l . | tee /tmp/gofmt.out && test ! -s /tmp/gofmt.out
      - run: go test ./...
      - run: go vet ./...
      - run: go test -tags postgres ./...
      - run: go vet -tags postgres ./...
      - run: go run ./cmd/simulator -csv /tmp/v03-current.csv

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: game
          POSTGRES_PASSWORD: game
          POSTGRES_DB: game
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U game -d game"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgres://game:game@localhost:5432/game?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Apply and verify tracked migrations
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" ./scripts/migrate_db.sh
          DATABASE_URL="$TEST_DATABASE_URL" ./scripts/migrate_db.sh
          latest_repo="$(for migration in db/migrations/*.sql; do basename "$migration" | cut -d_ -f1; done | sort -n | tail -1)"
          latest_db="$(psql "$TEST_DATABASE_URL" -Atqc "SELECT max(version_id) FROM goose_db_version WHERE is_applied")"
          test "$latest_db" = "$((10#$latest_repo))"
      - name: Verify incremental migration upgrade
        run: |
          migration_dir="$(mktemp -d)"
          trap 'rm -rf "$migration_dir"' EXIT
          cp db/migrations/*.sql "$migration_dir/"
          # Keep this probe one version beyond the repository so adding a
          # migration never requires editing the CI fixture by hand.
          latest_repo="$(
            for migration in db/migrations/*.sql; do
              basename "$migration" | cut -d_ -f1
            done | sort -n | tail -1
          )"
          latest_number=$((10#$latest_repo))
          probe_number=$((latest_number + 1))
          probe_name="$(printf '%06d_ci_incremental_probe.sql' "$probe_number")"
          cat > "$migration_dir/$probe_name" <<'SQL'
          -- +goose Up
          CREATE TABLE ci_incremental_migration_probe (id integer PRIMARY KEY);

          -- +goose Down
          DROP TABLE ci_incremental_migration_probe;
          SQL
          MIGRATIONS_DIR="$migration_dir" DATABASE_URL="$TEST_DATABASE_URL" ./scripts/migrate_db.sh
          latest_db="$(psql "$TEST_DATABASE_URL" -Atqc "SELECT max(version_id) FROM goose_db_version WHERE is_applied")"
          test "$latest_db" = "$probe_number"
          MIGRATIONS_DIR="$migration_dir" DATABASE_URL="$TEST_DATABASE_URL" ./scripts/migrate_db.sh
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'DROP TABLE ci_incremental_migration_probe;'
      - name: Verify legacy game-time upgrade equivalence
        run: ./scripts/test_game_time_migration.sh
      - run: go test -count=1 -p 1 -tags postgres ./...

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y shellcheck
      - name: Validate shell scripts
        run: |
          bash -n scripts/dev.sh
          bash -n scripts/test_dev.sh
          bash -n backend/scripts/bootstrap_db.sh
          bash -n backend/scripts/migrate_db.sh
          bash -n backend/scripts/reset_db.sh
          bash -n backend/scripts/reset_playtest_db.sh
          bash -n backend/scripts/test_game_time_migration.sh
          shellcheck scripts/dev.sh scripts/test_dev.sh \
            backend/scripts/bootstrap_db.sh backend/scripts/migrate_db.sh \
            backend/scripts/reset_db.sh backend/scripts/reset_playtest_db.sh \
            backend/scripts/test_game_time_migration.sh
      - name: Test launcher argument parsing
        run: ./scripts/test_dev.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run test:unit -- --run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
