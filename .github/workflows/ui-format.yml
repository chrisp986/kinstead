name: UI format

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Format changed UI files
        working-directory: frontend
        run: |
          npx prettier --write \
            src/lib/components/FarmReportPanel.svelte \
            src/lib/components/RelationshipPanel.svelte \
            src/lib/components/ResourceSummary.svelte \
            src/lib/components/ShipmentList.svelte \
            src/lib/components/shell/HouseholdHeader.svelte \
            src/lib/components/work/WorkerCard.svelte \
            src/lib/components/work/WorkPlanner.svelte
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-ui
          path: |
            frontend/src/lib/components/FarmReportPanel.svelte
            frontend/src/lib/components/RelationshipPanel.svelte
            frontend/src/lib/components/ResourceSummary.svelte
            frontend/src/lib/components/ShipmentList.svelte
            frontend/src/lib/components/shell/HouseholdHeader.svelte
            frontend/src/lib/components/work/WorkerCard.svelte
            frontend/src/lib/components/work/WorkPlanner.svelte
