openapi: 3.1.0
info:
  title: Household Simulation API
  version: 0.1.0
  description: Command and projection API for the browser client.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: getHealth
      responses:
        '200':
          description: API health
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string }
  /api/households/{householdId}/report:
    get:
      operationId: getHouseholdReport
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      responses:
        '200':
          description: Current household projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseholdReport' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/households/{householdId}/calendar:
    get:
      operationId: getHouseholdCalendar
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - name: from_game_day
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
        - name: to_game_day
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
        - name: category
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Deterministic simulated calendar projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarProjection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/households/{householdId}/assignments:
    get:
      operationId: listHouseholdAssignments
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      responses:
        '200':
          description: Household assignments
          content:
            application/json:
              schema:
                type: object
                required: [tick, assignments]
                properties:
                  tick: { type: integer, format: int64 }
                  assignments:
                    type: array
                    items: { $ref: '#/components/schemas/Assignment' }
    post:
      operationId: createHouseholdAssignment
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAssignmentIntent' }
      responses:
        '201':
          description: Assignment scheduled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assignment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/households/{householdId}/shipments:
    get:
      operationId: listHouseholdShipments
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      responses:
        '200':
          description: Incoming and outgoing household shipments
          content:
            application/json:
              schema:
                type: object
                required: [shipments]
                properties:
                  shipments:
                    type: array
                    items: { $ref: '#/components/schemas/Shipment' }
  /api/households/{householdId}/chronicle:
    get:
      operationId: listHouseholdChronicle
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      responses:
        '200':
          description: Newest structured household chronicle facts, up to 50 entries
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/ChronicleEntry' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/households/{householdId}/relationships:
    get:
      operationId: listHouseholdRelationships
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      responses:
        '200':
          description: Directed current relationship projections with newest-first event history
          content:
            application/json:
              schema:
                type: object
                required: [relationships]
                properties:
                  relationships:
                    type: array
                    items: { $ref: '#/components/schemas/Relationship' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/households/{householdId}/contracts:
    get:
      operationId: listHouseholdContracts
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      responses:
        '200':
          description: Contracts involving the household with their recurring obligations
          content:
            application/json:
              schema:
                type: object
                required: [contracts]
                properties:
                  contracts:
                    type: array
                    items: { $ref: '#/components/schemas/Contract' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/households/{householdId}/politics:
    get:
      operationId: getHouseholdPolitics
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      responses:
        '200':
          description: Political relationships and Jarl demands
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PoliticsOverview' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/political-demands/{decisionId}/respond:
    post:
      operationId: respondToPoliticalDemand
      parameters:
        - name: decisionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RespondPoliticalDemandIntent' }
      responses:
        '200':
          description: Demand resolved
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/contracts:
    post:
      operationId: proposeContract
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProposeContractIntent' }
      responses:
        '201':
          description: Contract proposed to the counterparty
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contract' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/contracts/{contractId}/respond:
    post:
      operationId: respondToContract
      parameters:
        - name: contractId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RespondContractIntent' }
      responses:
        '200':
          description: Proposal accepted or rejected; acceptance includes generated obligations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contract' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/contract-obligations/{obligationId}/dispatch:
    post:
      operationId: dispatchContractObligation
      parameters:
        - name: obligationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DispatchContractObligationIntent' }
      responses:
        '201':
          description: Promised goods reserved and geography-derived shipment linked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DispatchContractObligationResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/shipments/{shipmentId}/cancel:
    post:
      operationId: cancelShipment
      parameters:
        - name: shipmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelShipmentIntent' }
      responses:
        '200':
          description: Direct shipment cancelled and reserved goods returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shipment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/market/offers:
    get:
      operationId: listMarketOffers
      parameters:
        - name: world_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Active offers in the world
          content:
            application/json:
              schema:
                type: object
                required: [offers]
                properties:
                  offers:
                    type: array
                    items: { $ref: '#/components/schemas/MarketOffer' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/market/offers/{offerId}/purchase:
    post:
      operationId: purchaseMarketOffer
      parameters:
        - name: offerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseOfferIntent' }
      responses:
        '201':
          description: Purchase completed and shipment created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  parameters:
    HouseholdId:
      name: householdId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Invalid intent
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: Intent conflicts with current state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Projection not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Intent is not authorized for this resource
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        message: { type: string }
    Alert:
      type: object
      required: [level, code, message]
      properties:
        level: { type: string }
        code: { type: string }
        message: { type: string }
    ReportItem:
      type: object
      required: [code, severity]
      properties:
        code: { type: string }
        severity: { type: string, enum: [info, warning, critical] }
        target: { type: string, enum: [work, trade, contracts, politics, farm] }
        related_id: { type: string }
        due_game_day: { type: integer, format: int64 }
        data: { type: object, additionalProperties: true }
    ReportChangeWindow:
      type: object
      required: [from_tick, to_tick]
      properties:
        from_tick: { type: integer, format: int64 }
        to_tick: { type: integer, format: int64 }
    Character:
      type: object
      required: [id, name, birth_game_day, age, labor_permille, fatigue]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        birth_game_day: { type: integer, format: int64 }
        age: { type: integer, minimum: 0 }
        labor_permille: { type: integer, format: int64 }
        fatigue: { type: integer }
        specialization: { type: string }
    Assignment:
      type: object
      required: [id, character_id, character, activity, intensity, status]
      properties:
        id: { type: string, format: uuid }
        character_id: { type: string, format: uuid }
        character: { type: string }
        activity: { type: string }
        intensity: { type: string }
        starts_game_day: { type: integer, format: int64 }
        ends_game_day: { type: integer, format: int64 }
        status: { type: string }
    HouseholdReport:
      type: object
      required:
        [household_id, household_name, world_id, setting_start_year, tick, game_day, calendar, supply_days, resources, characters, assignments, alerts, change_window, recent_changes, attention, decisions]
      properties:
        household_id: { type: string, format: uuid }
        household_name: { type: string }
        world_id: { type: string, format: uuid }
        setting_start_year: { type: integer }
        tick: { type: integer, format: int64 }
        game_day: { type: integer, format: int64 }
        calendar: { $ref: '#/components/schemas/CalendarBreakdown' }
        season: { type: string }
        supply_days: { type: number }
        resources:
          type: object
          additionalProperties: { type: number }
        characters:
          type: array
          items: { $ref: '#/components/schemas/Character' }
        assignments:
          type: array
          items: { $ref: '#/components/schemas/Assignment' }
        alerts:
          type: array
          items: { $ref: '#/components/schemas/Alert' }
        change_window: { $ref: '#/components/schemas/ReportChangeWindow' }
        recent_changes:
          type: array
          items: { $ref: '#/components/schemas/ChronicleEntry' }
        attention:
          type: array
          items: { $ref: '#/components/schemas/ReportItem' }
        decisions:
          type: array
          items: { $ref: '#/components/schemas/ReportItem' }
    CalendarBreakdown:
      type: object
      required: [game_day, year_index, day_of_year, week_of_year, week_of_half, day_of_week, production_season, half_year, seasonal_phase, phase]
      properties:
        game_day: { type: integer, format: int64 }
        year_index: { type: integer, format: int64 }
        day_of_year: { type: integer, format: int64 }
        week_of_year: { type: integer, format: int64 }
        week_of_half: { type: integer, format: int64 }
        day_of_week: { type: integer, format: int64 }
        production_season: { type: string, enum: [spring, summer, autumn, winter] }
        half_year: { type: string, enum: [summer, winter] }
        seasonal_phase: { type: string }
        phase: { type: string }
    CalendarEvent:
      type: object
      required: [id, game_day, category, kind, importance, action_required]
      properties:
        id: { type: string }
        game_day: { type: integer, format: int64 }
        category: { type: string, enum: [season, shipment, contract, politics, world, farm] }
        kind:
          type: string
          enum: [season_start, festival, harvest, delivery_due, dispatch_deadline, shipment_arrival, political_deadline, assignment_end, assembly]
        code: { type: string }
        end_game_day: { type: integer, format: int64 }
        importance: { type: string, enum: [critical, important, context] }
        action_required: { type: boolean }
        related_id: { type: string }
        resource_type: { type: string }
        quantity_milli: { type: integer, format: int64 }
        counterparty_household_id: { type: string, format: uuid }
        counterparty_household_name: { type: string }
        status: { type: string }
    CalendarProjection:
      type: object
      required: [household_id, world_id, setting_start_year, current_game_day, calendar, next_half_year, from_game_day, to_game_day, events]
      properties:
        household_id: { type: string, format: uuid }
        world_id: { type: string, format: uuid }
        setting_start_year: { type: integer }
        current_game_day: { type: integer, format: int64 }
        calendar: { $ref: '#/components/schemas/CalendarBreakdown' }
        next_half_year:
          type: object
          required: [type, game_day, days_until]
          properties:
            type: { type: string, enum: [summer, winter] }
            game_day: { type: integer, format: int64 }
            days_until: { type: integer, format: int64 }
        from_game_day: { type: integer, format: int64 }
        to_game_day: { type: integer, format: int64 }
        events:
          type: array
          items: { $ref: '#/components/schemas/CalendarEvent' }
    Shipment:
      type: object
      required:
        [id, world_id, sender_household_id, receiver_household_id, origin_location_id, destination_location_id, resource_type, quantity_milli, departure_game_day, expected_arrival_game_day, transport_cost_milli, status]
      properties:
        id: { type: string, format: uuid }
        world_id: { type: string, format: uuid }
        sender_household_id: { type: string, format: uuid }
        receiver_household_id: { type: string, format: uuid }
        origin_location_id: { type: string, format: uuid }
        destination_location_id: { type: string, format: uuid }
        resource_type: { type: string }
        quantity_milli: { type: integer, format: int64 }
        departure_game_day: { type: integer, format: int64 }
        expected_arrival_game_day: { type: integer, format: int64 }
        actual_arrival_game_day: { type: integer, format: int64 }
        transport_cost_milli: { type: integer, format: int64 }
        status: { type: string, enum: [prepared, in_transit, arrived, cancelled] }
    ChronicleEntry:
      type: object
      required: [id, occurred_game_day, entry_type, data]
      properties:
        id: { type: string, format: uuid }
        occurred_game_day: { type: integer, format: int64 }
        entry_type: { type: string }
        subject_character_id: { type: string, format: uuid }
        subject_character_name: { type: string }
        related_household_id: { type: string, format: uuid }
        related_household_name: { type: string }
        related_shipment_id: { type: string, format: uuid }
        related_assignment_id: { type: string, format: uuid }
        related_contract_id: { type: string, format: uuid }
        related_obligation_id: { type: string, format: uuid }
        related_household_decision_id: { type: string, format: uuid }
        related_political_actor_id: { type: string, format: uuid }
        data:
          type: object
          additionalProperties: true
    RelationshipEvent:
      type: object
      required: [id, event_type, trust_delta, occurred_tick, occurred_game_day, data]
      properties:
        id: { type: string, format: uuid }
        event_type:
          type: string
          enum: [contract_obligation_fulfilled, contract_obligation_late, contract_obligation_broken]
        trust_delta: { type: integer }
        occurred_tick: { type: integer, format: int64 }
        occurred_game_day: { type: integer, format: int64 }
        related_contract_id: { type: string, format: uuid }
        related_shipment_id: { type: string, format: uuid }
        related_obligation_id: { type: string, format: uuid }
        data:
          type: object
          additionalProperties: true
    Relationship:
      type: object
      required:
        [world_id, source_household_id, source_household_name, target_household_id, target_household_name, trust, standing, events]
      properties:
        world_id: { type: string, format: uuid }
        source_household_id: { type: string, format: uuid }
        source_household_name: { type: string }
        target_household_id: { type: string, format: uuid }
        target_household_name: { type: string }
        trust: { type: integer, minimum: -100, maximum: 100 }
        standing: { type: string, enum: [disapproving, neutral, favorable, connected] }
        first_interaction_tick: { type: integer, format: int64 }
        events:
          type: array
          items: { $ref: '#/components/schemas/RelationshipEvent' }
    PoliticsOverview:
      type: object
      required: [relationships, decisions]
      properties:
        relationships:
          type: array
          items: { $ref: '#/components/schemas/PoliticalRelationship' }
        decisions:
          type: array
          items: { $ref: '#/components/schemas/PoliticalDecision' }
    PoliticalRelationship:
      type: object
      required: [political_actor_id, actor_name, actor_type, score, standing]
      properties:
        political_actor_id: { type: string, format: uuid }
        actor_name: { type: string }
        actor_type: { type: string }
        score: { type: integer, minimum: -100, maximum: 100 }
        standing: { type: string, enum: [disapproving, neutral, favorable, connected] }
    PoliticalDecision:
      type: object
      required: [id, demand_type, status, actor_id, actor_name, actor_type, available_from_tick, expires_tick, available_from_game_day, expires_game_day, options]
      properties:
        id: { type: string, format: uuid }
        demand_type: { type: string, enum: [political_labor_service, political_levy] }
        status: { type: string, enum: [pending, resolved, auto_resolved] }
        actor_id: { type: string, format: uuid }
        actor_name: { type: string }
        actor_type: { type: string }
        available_from_tick: { type: integer, format: int64 }
        expires_tick: { type: integer, format: int64 }
        available_from_game_day: { type: integer, format: int64 }
        expires_game_day: { type: integer, format: int64 }
        selected_option: { type: string }
        standing_delta: { type: integer }
        parameters: { type: object, additionalProperties: true }
        options:
          type: array
          items: { $ref: '#/components/schemas/PoliticalOption' }
        eligible_characters:
          type: array
          items: { $ref: '#/components/schemas/PoliticalServiceCandidate' }
    PoliticalServiceCandidate:
      type: object
      required: [id, name, labor_permille]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        labor_permille: { type: integer, format: int64 }
    PoliticalOption:
      type: object
      required: [code, standing_delta]
      properties:
        code: { type: string }
        resource_code: { type: string }
        resource_milli: { type: integer, format: int64 }
        standing_delta: { type: integer }
        service_ticks: { type: integer, format: int64 }
        requires_character: { type: boolean }
    RespondPoliticalDemandIntent:
      type: object
      required: [household_id, option]
      properties:
        household_id: { type: string, format: uuid }
        option: { type: string, enum: [serve, pay_wood, pay_silver, refuse] }
        character_id: { type: string, format: uuid }
    ContractTerm:
      type: object
      required: [debtor_household_id, creditor_household_id, resource_type, quantity_milli]
      properties:
        debtor_household_id: { type: string, format: uuid }
        creditor_household_id: { type: string, format: uuid }
        resource_type: { type: string }
        quantity_milli: { type: integer, format: int64, minimum: 1 }
    ContractObligation:
      type: object
      required:
        [id, contract_id, debtor_household_id, creditor_household_id, resource_type, quantity_milli, due_game_day, status]
      properties:
        id: { type: string, format: uuid }
        contract_id: { type: string, format: uuid }
        debtor_household_id: { type: string, format: uuid }
        creditor_household_id: { type: string, format: uuid }
        resource_type: { type: string }
        quantity_milli: { type: integer, format: int64 }
        due_game_day: { type: integer, format: int64 }
        latest_dispatch_game_day: { type: integer, format: int64 }
        shipment_id: { type: string, format: uuid }
        status: { type: string, enum: [pending, dispatched, fulfilled, late, broken] }
        fulfilled_game_day: { type: integer, format: int64 }
    Contract:
      type: object
      required:
        [id, world_id, party_a_household_id, party_b_household_id, start_game_day, end_game_day, interval_days, interval, status, terms, obligations]
      properties:
        id: { type: string, format: uuid }
        world_id: { type: string, format: uuid }
        party_a_household_id: { type: string, format: uuid }
        party_b_household_id: { type: string, format: uuid }
        start_game_day: { type: integer, format: int64 }
        end_game_day: { type: integer, format: int64 }
        interval_days: { type: integer, format: int64, enum: [7, 14, 28] }
        interval: { type: string }
        status: { type: string, enum: [proposed, active, completed, rejected, cancelled, broken] }
        terms:
          type: array
          items: { $ref: '#/components/schemas/ContractTerm' }
        obligations:
          type: array
          items: { $ref: '#/components/schemas/ContractObligation' }
    ProposeContractIntent:
      type: object
      required: [proposer_household_id, counterparty_household_id, start_game_day, interval_days, terms]
      properties:
        proposer_household_id: { type: string, format: uuid }
        counterparty_household_id: { type: string, format: uuid }
        start_game_day: { type: integer, format: int64, minimum: 1 }
        end_game_day: { type: integer, format: int64, minimum: 1, description: Optional explicit end; otherwise the server resolves end_condition. }
        interval_days: { type: integer, format: int64, enum: [7, 14, 28] }
        end_condition:
          type: object
          required: [type]
          properties:
            type: { type: string, enum: [fixed_delivery_count, fixed_game_day, winter_start, summer_start] }
            game_day: { type: integer, format: int64 }
            delivery_count: { type: integer, minimum: 1 }
        terms:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ContractTerm' }
        # Deprecated execution-only compatibility fields. New clients must
        # use the game-day schedule above.
        first_due_game_day: { type: integer, format: int64, minimum: 1, deprecated: true }
        starts_tick: { type: integer, format: int64, deprecated: true }
        ends_tick: { type: integer, format: int64, deprecated: true }
        interval_ticks: { type: integer, format: int64, deprecated: true }
    RespondContractIntent:
      type: object
      required: [counterparty_household_id, decision]
      properties:
        counterparty_household_id: { type: string, format: uuid }
        decision: { type: string, enum: [accept, reject] }
    DispatchContractObligationIntent:
      type: object
      required: [debtor_household_id]
      properties:
        debtor_household_id: { type: string, format: uuid }
    DispatchContractObligationResult:
      type: object
      required: [obligation, shipment]
      properties:
        obligation: { $ref: '#/components/schemas/ContractObligation' }
        shipment: { $ref: '#/components/schemas/Shipment' }
    MarketOffer:
      type: object
      required:
        [id, world_id, seller_household_id, origin_location_id, resource_type, quantity_remaining_milli, price_per_unit_milli, created_tick, status]
      properties:
        id: { type: string, format: uuid }
        world_id: { type: string, format: uuid }
        seller_household_id: { type: string, format: uuid }
        origin_location_id: { type: string, format: uuid }
        resource_type: { type: string }
        quantity_remaining_milli: { type: integer, format: int64 }
        price_per_unit_milli: { type: integer, format: int64 }
        created_tick: { type: integer, format: int64 }
        expires_tick: { type: integer, format: int64 }
        status: { type: string }
    CreateAssignmentIntent:
      type: object
      required: [character_id, activity, intensity, duration_ticks]
      properties:
        character_id: { type: string, format: uuid }
        activity: { type: string, enum: [agriculture, fishing, woodcutting, rest] }
        intensity: { type: string, enum: [light, normal, high] }
        duration_ticks: { type: integer, enum: [1, 3, 6, 12] }
        starts_tick: { type: integer, format: int64 }
    PurchaseOfferIntent:
      type: object
      required: [buyer_household_id, quantity_milli]
      properties:
        buyer_household_id: { type: string, format: uuid }
        quantity_milli: { type: integer, format: int64, minimum: 1 }
    CancelShipmentIntent:
      type: object
      required: [sender_household_id]
      properties:
        sender_household_id: { type: string, format: uuid }
    PurchaseResult:
      type: object
      required: [cost_milli, goods_cost_milli, transport_cost_milli, offer, shipment]
      properties:
        cost_milli: { type: integer, format: int64 }
        goods_cost_milli: { type: integer, format: int64 }
        transport_cost_milli: { type: integer, format: int64 }
        offer: { $ref: '#/components/schemas/MarketOffer' }
        shipment: { $ref: '#/components/schemas/Shipment' }
