openapi: 3.1.0
info:
  title: Household Simulation API
  version: 0.1.0
  description: Command and projection API for the browser client.
servers:
  - url: http://localhost:8080
security:
  - playerSession: []
paths:
  /api/session:
    get:
      operationId: getSession
      responses:
        '200':
          description: Authenticated player's households
          content:
            application/json:
              schema:
                type: object
                required: [households]
                properties:
                  households:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
        '401':
          description: Missing, expired, or revoked session
  /healthz:
    get:
      security: []
      operationId: getHealth
      responses:
        '200':
          description: API health
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string }
  /api/households/{householdId}/report:
    get:
      operationId: getHouseholdReport
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      responses:
        '200':
          description: Current household projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseholdReport' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/households/{householdId}/report/acknowledge:
    post:
      operationId: acknowledgeHouseholdReport
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcknowledgeReportIntent' }
      responses:
        '204': { description: Report events acknowledged through the supplied game day }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/households/{householdId}/calendar:
    get:
      operationId: getHouseholdCalendar
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - name: from_game_day
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
        - name: to_game_day
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
        - name: category
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Deterministic simulated calendar projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarProjection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/households/{householdId}/assignments:
    get:
      operationId: listHouseholdAssignments
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      responses:
        '200':
          description: Household assignments
          content:
            application/json:
              schema:
                type: object
                required: [tick, assignments]
                properties:
                  tick: { type: integer, format: int64 }
                  assignments:
                    type: array
                    items: { $ref: '#/components/schemas/Assignment' }
    post:
      operationId: createHouseholdAssignment
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAssignmentIntent' }
      responses:
        '201':
          description: Assignment scheduled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assignment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/households/{householdId}/work-preview:
    post:
      operationId: previewHouseholdWork
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAssignmentIntent' }
      responses:
        '200':
          description: Authoritative production and fatigue preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/households/{householdId}/work-plan:
    get:
      operationId: getHouseholdWorkPlan
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      responses:
        '200':
          description: Persistent occupations and temporary commitments
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkPlan' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/households/{householdId}/characters/{characterId}/occupation:
    put:
      operationId: changeHouseholdOccupation
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - name: characterId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeOccupationIntent' }
      responses:
        '200':
          description: Occupation changed or pending change cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OccupationChangeResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/households/{householdId}/work-plan/preview:
    post:
      operationId: previewHouseholdWorkPlan
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OccupationPreviewIntent' }
      responses:
        '200':
          description: Seven-game-day baseline and proposed household forecast
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseholdForecast' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/households/{householdId}/shipments:
    get:
      operationId: listHouseholdShipments
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      responses:
        '200':
          description: Incoming and outgoing household shipments
          content:
            application/json:
              schema:
                type: object
                required: [shipments]
                properties:
                  shipments:
                    type: array
                    items: { $ref: '#/components/schemas/Shipment' }
  /api/households/{householdId}/chronicle:
    get:
      operationId: listHouseholdChronicle
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      responses:
        '200':
          description: Newest structured household chronicle facts, up to 50 entries
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/ChronicleEntry' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/households/{householdId}/relationships:
    get:
      operationId: listHouseholdRelationships
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      responses:
        '200':
          description: Directed current relationship projections with newest-first event history
          content:
            application/json:
              schema:
                type: object
                required: [relationships]
                properties:
                  relationships:
                    type: array
                    items: { $ref: '#/components/schemas/Relationship' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/households/{householdId}/contracts:
    get:
      operationId: listHouseholdContracts
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      responses:
        '200':
          description: Contracts involving the household with their recurring obligations
          content:
            application/json:
              schema:
                type: object
                required: [contracts]
                properties:
                  contracts:
                    type: array
                    items: { $ref: '#/components/schemas/Contract' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/households/{householdId}/politics:
    get:
      operationId: getHouseholdPolitics
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      responses:
        '200':
          description: Political relationships and Jarl demands
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PoliticsOverview' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/political-demands/{decisionId}/respond:
    post:
      operationId: respondToPoliticalDemand
      parameters:
        - name: decisionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RespondPoliticalDemandIntent' }
      responses:
        '200':
          description: Demand resolved
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/contracts:
    post:
      operationId: proposeContract
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProposeContractIntent' }
      responses:
        '201':
          description: Contract proposed to the counterparty
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contract' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/contracts/preview:
    post:
      operationId: previewContract
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProposeContractIntent' }
      responses:
        '200':
          description: Authoritative recurring delivery preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/contracts/{contractId}/respond:
    post:
      operationId: respondToContract
      parameters:
        - name: contractId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RespondContractIntent' }
      responses:
        '200':
          description: Proposal accepted or rejected; acceptance includes generated obligations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contract' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/contract-obligations/{obligationId}/dispatch:
    post:
      operationId: dispatchContractObligation
      parameters:
        - name: obligationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DispatchContractObligationIntent' }
      responses:
        '201':
          description: Promised goods reserved and geography-derived shipment linked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DispatchContractObligationResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/shipments/{shipmentId}/cancel:
    post:
      operationId: cancelShipment
      parameters:
        - name: shipmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelShipmentIntent' }
      responses:
        '200':
          description: Direct shipment cancelled and reserved goods returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shipment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/market/offers:
    get:
      operationId: listMarketOffers
      parameters:
        - name: world_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Active offers in the world
          content:
            application/json:
              schema:
                type: object
                required: [offers]
                properties:
                  offers:
                    type: array
                    items: { $ref: '#/components/schemas/MarketOffer' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/market/offers/{offerId}/purchase:
    post:
      operationId: purchaseMarketOffer
      parameters:
        - name: offerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseOfferIntent' }
      responses:
        '201':
          description: Purchase completed and shipment created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/market/offers/{offerId}/quote:
    post:
      operationId: quoteMarketOffer
      parameters:
        - name: offerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseOfferIntent' }
      responses:
        '200':
          description: Validated purchase costs and delivery estimate without reservation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketQuote' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    playerSession:
      type: http
      scheme: bearer
      description: Opaque expiring player session; households must belong to this player. Unauthorized household access returns 403.
  parameters:
    HouseholdId:
      name: householdId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Invalid intent
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: Intent conflicts with current state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Projection not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Intent is not authorized for this resource
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        message: { type: string }
    Alert:
      type: object
      required: [level, code, message]
      properties:
        level: { type: string }
        code: { type: string }
        message: { type: string }
    ReportItem:
      type: object
      required: [code, severity]
      properties:
        code: { type: string }
        severity: { type: string, enum: [info, warning, critical] }
        target: { type: string, enum: [work, trade, contracts, politics, farm] }
        related_id: { type: string }
        due_game_day: { type: integer, format: int64 }
        data: { type: object, additionalProperties: true }
    ReportChangeWindow:
      type: object
      required: [from_tick, to_tick]
      properties:
        from_tick: { type: integer, format: int64 }
        to_tick: { type: integer, format: int64 }
    Character:
      type: object
      required: [id, name, birth_game_day, age, labor_permille, fatigue, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        birth_game_day: { type: integer, format: int64 }
        age: { type: integer, minimum: 0 }
        labor_permille: { type: integer, format: int64 }
        fatigue: { type: integer }
        status: { type: string }
        specialization: { type: string }
        occupation: { $ref: '#/components/schemas/Occupation' }
        current_activity: { type: string }
        current_activity_reason: { type: string }
    Assignment:
      type: object
      required: [id, character_id, character, activity, intensity, status]
      properties:
        id: { type: string, format: uuid }
        character_id: { type: string, format: uuid }
        character: { type: string }
        activity: { type: string }
        intensity: { type: string }
        starts_game_day: { type: integer, format: int64 }
        ends_game_day: { type: integer, format: int64 }
        status: { type: string }
    HouseholdReport:
      type: object
      required:
        [household_id, household_name, world_id, simulation_model, setting_start_year, tick, game_day, calendar, supply_game_days, supply_status, resources, characters, assignments, alerts, change_window, recent_changes, since_you_were_away, attention, decisions, chronicle_cursor]
      properties:
        household_id: { type: string, format: uuid }
        household_name: { type: string }
        world_id: { type: string, format: uuid }
        simulation_model: { type: string, enum: [legacy, daily_labor_v1, monthly_seasons_v1] }
        setting_start_year: { type: integer }
        tick: { type: integer, format: int64 }
        game_day: { type: integer, format: int64 }
        calendar: { $ref: '#/components/schemas/CalendarBreakdown' }
        season: { type: string }
        season_day: { type: integer, minimum: 1, maximum: 31 }
        season_length_days: { type: integer, minimum: 28, maximum: 31 }
        current_moment: { $ref: '#/components/schemas/Moment' }
        world_utc_offset_minutes: { type: integer, minimum: -840, maximum: 840 }
        workday: { $ref: '#/components/schemas/Workday' }
        next_working_period: { $ref: '#/components/schemas/Moment' }
        next_production_settlement: { $ref: '#/components/schemas/Moment' }
        supply_game_days: { type: integer, format: int64 }
        supply_status: { type: string, enum: [safe, strained, critical, emergency] }
        resources:
          type: object
          additionalProperties: { type: number }
        characters:
          type: array
          items: { $ref: '#/components/schemas/Character' }
        assignments:
          type: array
          items: { $ref: '#/components/schemas/Assignment' }
        alerts:
          type: array
          items: { $ref: '#/components/schemas/Alert' }
        change_window: { $ref: '#/components/schemas/ReportChangeWindow' }
        recent_changes:
          type: array
          items: { $ref: '#/components/schemas/ChronicleEntry' }
        since_you_were_away:
          type: array
          items: { $ref: '#/components/schemas/ChronicleEntry' }
        attention:
          type: array
          items: { $ref: '#/components/schemas/ReportItem' }
        decisions:
          type: array
          items: { $ref: '#/components/schemas/ReportItem' }
        chronicle_cursor: { type: integer, format: int64 }
        pending_output_milli:
          type: object
          additionalProperties: { type: integer, format: int64 }
        forecast_net_milli:
          type: object
          additionalProperties: { type: integer, format: int64 }
        minimum_expected_food_milli: { type: integer, format: int64 }
    CalendarBreakdown:
      type: object
      required: [game_day, year_index, day_of_year, week_of_year, week_of_half, day_of_week, production_season, half_year, seasonal_phase, phase]
      properties:
        game_day: { type: integer, format: int64 }
        year_index: { type: integer, format: int64 }
        day_of_year: { type: integer, format: int64 }
        week_of_year: { type: integer, format: int64 }
        week_of_half: { type: integer, format: int64 }
        day_of_week: { type: integer, format: int64 }
        production_season: { type: string, enum: [spring, summer, autumn, winter] }
        half_year: { type: string, enum: [summer, winter] }
        seasonal_phase: { type: string }
        phase: { type: string }
    CalendarEvent:
      type: object
      required: [id, game_day, category, kind, importance, action_required]
      properties:
        id: { type: string }
        game_day: { type: integer, format: int64 }
        category: { type: string, enum: [season, shipment, contract, politics, world, farm] }
        kind:
          type: string
          enum: [season_start, festival, harvest, delivery_due, dispatch_deadline, shipment_arrival, political_deadline, assignment_end, assembly]
        code: { type: string }
        end_game_day: { type: integer, format: int64 }
        importance: { type: string, enum: [critical, important, context] }
        action_required: { type: boolean }
        related_id: { type: string }
        resource_type: { type: string }
        quantity_milli: { type: integer, format: int64 }
        counterparty_household_id: { type: string, format: uuid }
        counterparty_household_name: { type: string }
        status: { type: string }
    CalendarProjection:
      type: object
      required: [household_id, world_id, setting_start_year, current_game_day, calendar, from_game_day, to_game_day, events]
      properties:
        household_id: { type: string, format: uuid }
        world_id: { type: string, format: uuid }
        setting_start_year: { type: integer }
        current_game_day: { type: integer, format: int64 }
        calendar: { $ref: '#/components/schemas/CalendarBreakdown' }
        next_half_year:
          type: object
          required: [type, game_day, days_until]
          properties:
            type: { type: string, enum: [summer, winter] }
            game_day: { type: integer, format: int64 }
            days_until: { type: integer, format: int64 }
        next_season:
          type: object
          required: [type, game_day, days_until]
          properties:
            type: { type: string, enum: [spring, summer, autumn, winter] }
            game_day: { type: integer, format: int64 }
            days_until: { type: integer, format: int64 }
        from_game_day: { type: integer, format: int64 }
        to_game_day: { type: integer, format: int64 }
        events:
          type: array
          items: { $ref: '#/components/schemas/CalendarEvent' }
    Shipment:
      type: object
      required:
        [id, world_id, sender_household_id, sender_household_name, receiver_household_id, receiver_household_name, origin_location_id, destination_location_id, resource_type, quantity_milli, departure_game_day, expected_arrival_game_day, transport_cost_milli, status]
      properties:
        id: { type: string, format: uuid }
        world_id: { type: string, format: uuid }
        sender_household_id: { type: string, format: uuid }
        sender_household_name: { type: string }
        receiver_household_id: { type: string, format: uuid }
        receiver_household_name: { type: string }
        origin_location_id: { type: string, format: uuid }
        destination_location_id: { type: string, format: uuid }
        resource_type: { type: string }
        quantity_milli: { type: integer, format: int64 }
        departure_game_day: { type: integer, format: int64 }
        expected_arrival_game_day: { type: integer, format: int64 }
        actual_arrival_game_day: { type: integer, format: int64 }
        transport_cost_milli: { type: integer, format: int64 }
        status: { type: string, enum: [prepared, in_transit, arrived, cancelled] }
    ChronicleEntry:
      type: object
      required: [id, occurred_game_day, entry_type, data]
      properties:
        id: { type: string, format: uuid }
        occurred_game_day: { type: integer, format: int64 }
        entry_type: { type: string }
        subject_character_id: { type: string, format: uuid }
        subject_character_name: { type: string }
        related_household_id: { type: string, format: uuid }
        related_household_name: { type: string }
        related_shipment_id: { type: string, format: uuid }
        related_assignment_id: { type: string, format: uuid }
        related_contract_id: { type: string, format: uuid }
        related_obligation_id: { type: string, format: uuid }
        related_household_decision_id: { type: string, format: uuid }
        related_political_actor_id: { type: string, format: uuid }
        data:
          type: object
          additionalProperties: true
    RelationshipEvent:
      type: object
      required: [id, event_type, trust_delta, occurred_tick, occurred_game_day, data]
      properties:
        id: { type: string, format: uuid }
        event_type:
          type: string
          enum: [contract_obligation_fulfilled, contract_obligation_late, contract_obligation_broken]
