        occurred_tick: { type: integer, format: int64 }
        occurred_game_day: { type: integer, format: int64 }
        related_contract_id: { type: string, format: uuid }
        related_shipment_id: { type: string, format: uuid }
        related_obligation_id: { type: string, format: uuid }
        data:
          type: object
          additionalProperties: true
