openapi: 3.1.0
info:
  title: Household Simulation API
  version: 0.1.0
  description: Command and projection API for the browser client.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: getHealth
      responses:
        '200':
          description: API health
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string }
  /api/households/{householdId}/report:
    get:
      operationId: getHouseholdReport
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      responses:
        '200':
          description: Current household projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseholdReport' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/households/{householdId}/assignments:
    get:
      operationId: listHouseholdAssignments
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      responses:
        '200':
          description: Household assignments
          content:
            application/json:
              schema:
                type: object
                required: [tick, assignments]
                properties:
                  tick: { type: integer, format: int64 }
                  assignments:
                    type: array
                    items: { $ref: '#/components/schemas/Assignment' }
    post:
      operationId: createHouseholdAssignment
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAssignmentIntent' }
      responses:
        '201':
          description: Assignment scheduled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assignment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/households/{householdId}/shipments:
    get:
      operationId: listHouseholdShipments
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      responses:
        '200':
          description: Incoming and outgoing household shipments
          content:
            application/json:
              schema:
                type: object
                required: [shipments]
                properties:
                  shipments:
                    type: array
                    items: { $ref: '#/components/schemas/Shipment' }
  /api/households/{householdId}/chronicle:
    get:
      operationId: listHouseholdChronicle
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      responses:
        '200':
          description: Newest structured household chronicle facts, up to 50 entries
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/ChronicleEntry' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/market/offers:
    get:
      operationId: listMarketOffers
      parameters:
        - name: world_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Active offers in the world
          content:
            application/json:
              schema:
                type: object
                required: [offers]
                properties:
                  offers:
                    type: array
                    items: { $ref: '#/components/schemas/MarketOffer' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/market/offers/{offerId}/purchase:
    post:
      operationId: purchaseMarketOffer
      parameters:
        - name: offerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseOfferIntent' }
      responses:
        '201':
          description: Purchase completed and shipment created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  parameters:
    HouseholdId:
      name: householdId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Invalid intent
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: Intent conflicts with current state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Projection not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        message: { type: string }
    Alert:
      type: object
      required: [level, code, message]
      properties:
        level: { type: string }
        code: { type: string }
        message: { type: string }
    Character:
      type: object
      required: [id, name, birth_date, age, labor_permille, fatigue]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        birth_date: { type: string, format: date }
        age: { type: integer, minimum: 0 }
        labor_permille: { type: integer, format: int64 }
        fatigue: { type: integer }
        specialization: { type: string }
    Assignment:
      type: object
      required: [id, character_id, character, activity, intensity, starts_tick, ends_tick, status]
      properties:
        id: { type: string, format: uuid }
        character_id: { type: string, format: uuid }
        character: { type: string }
        activity: { type: string }
        intensity: { type: string }
        starts_tick: { type: integer, format: int64 }
        ends_tick: { type: integer, format: int64 }
        status: { type: string }
    HouseholdReport:
      type: object
      required:
        [household_id, household_name, world_id, tick, historical_date, season, supply_days, resources, characters, assignments, alerts]
      properties:
        household_id: { type: string, format: uuid }
        household_name: { type: string }
        world_id: { type: string, format: uuid }
        tick: { type: integer, format: int64 }
        historical_date: { type: string, format: date }
        season: { type: string }
        supply_days: { type: number }
        resources:
          type: object
          additionalProperties: { type: number }
        characters:
          type: array
          items: { $ref: '#/components/schemas/Character' }
        assignments:
          type: array
          items: { $ref: '#/components/schemas/Assignment' }
        alerts:
          type: array
          items: { $ref: '#/components/schemas/Alert' }
    Shipment:
      type: object
      required:
        [id, world_id, sender_household_id, receiver_household_id, origin_location_id, destination_location_id, resource_type, quantity_milli, departure_tick, expected_arrival_tick, transport_cost_milli, status]
      properties:
        id: { type: string, format: uuid }
        world_id: { type: string, format: uuid }
        sender_household_id: { type: string, format: uuid }
        receiver_household_id: { type: string, format: uuid }
        origin_location_id: { type: string, format: uuid }
        destination_location_id: { type: string, format: uuid }
        resource_type: { type: string }
        quantity_milli: { type: integer, format: int64 }
        departure_tick: { type: integer, format: int64 }
        expected_arrival_tick: { type: integer, format: int64 }
        actual_arrival_tick: { type: integer, format: int64 }
        transport_cost_milli: { type: integer, format: int64 }
        status: { type: string, enum: [prepared, in_transit, arrived, cancelled] }
    ChronicleEntry:
      type: object
      required: [id, occurred_tick, entry_type, data]
      properties:
        id: { type: string, format: uuid }
        occurred_tick: { type: integer, format: int64 }
        entry_type: { type: string }
        subject_character_id: { type: string, format: uuid }
        subject_character_name: { type: string }
        related_household_id: { type: string, format: uuid }
        related_household_name: { type: string }
        related_shipment_id: { type: string, format: uuid }
        related_assignment_id: { type: string, format: uuid }
        data:
          type: object
          additionalProperties: true
    MarketOffer:
      type: object
      required:
        [id, world_id, seller_household_id, origin_location_id, resource_type, quantity_remaining_milli, price_per_unit_milli, created_tick, status]
      properties:
        id: { type: string, format: uuid }
        world_id: { type: string, format: uuid }
        seller_household_id: { type: string, format: uuid }
        origin_location_id: { type: string, format: uuid }
        resource_type: { type: string }
        quantity_remaining_milli: { type: integer, format: int64 }
        price_per_unit_milli: { type: integer, format: int64 }
        created_tick: { type: integer, format: int64 }
        expires_tick: { type: integer, format: int64 }
        status: { type: string }
    CreateAssignmentIntent:
      type: object
      required: [character_id, activity, intensity, duration_ticks]
      properties:
        character_id: { type: string, format: uuid }
        activity: { type: string, enum: [agriculture, fishing, woodcutting, rest] }
        intensity: { type: string, enum: [light, normal, high] }
        duration_ticks: { type: integer, enum: [1, 3, 6, 12] }
        starts_tick: { type: integer, format: int64 }
    PurchaseOfferIntent:
      type: object
      required: [buyer_household_id, quantity_milli]
      properties:
        buyer_household_id: { type: string, format: uuid }
        quantity_milli: { type: integer, format: int64, minimum: 1 }
    PurchaseResult:
      type: object
      required: [cost_milli, goods_cost_milli, transport_cost_milli, offer, shipment]
      properties:
        cost_milli: { type: integer, format: int64 }
        goods_cost_milli: { type: integer, format: int64 }
        transport_cost_milli: { type: integer, format: int64 }
        offer: { $ref: '#/components/schemas/MarketOffer' }
        shipment: { $ref: '#/components/schemas/Shipment' }
